<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<title>Prototype — anonymisation PDF avec mise en page</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;padding:18px;background:#f3f8f5;color:#15231c}
 h1{font-size:17px;margin:0 0 4px} .sub{color:#5d6f66;font-size:13px;margin-bottom:14px}
 #etat{font-size:13px;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid #e3ece7;margin-bottom:12px}
 .vues{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .vue{background:#fff;border:1px solid #e3ece7;border-radius:12px;padding:10px}
 .vue h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#00824d;margin:0 0 8px}
 .scene{position:relative;line-height:0}
 .scene img{width:100%;height:auto;border:1px solid #e3ece7;border-radius:6px}
 .zone{position:absolute;background:rgba(255,126,182,.32);border:1px solid #ff7eb6;border-radius:3px;cursor:help}
 table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;background:#fff}
 th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #e3ece7}
 th{color:#5d6f66;font-size:10px;text-transform:uppercase}
 code{background:#eafaf1;color:#00824d;padding:1px 5px;border-radius:4px}
</style></head><body>
<h1>Prototype — anonymisation PDF à mise en page préservée</h1>
<div class="sub">Rendu, détection, caviardage réel et vérification : tout dans un Web Worker, aucune donnée ne sort du navigateur.</div>
<div id="etat">Chargement…</div>
<div class="vues">
  <div class="vue"><h2>1 · Document d'origine (zones détectées)</h2><div class="scene" id="avant"></div></div>
  <div class="vue"><h2>2 · Résultat anonymisé</h2><div class="scene" id="apres"></div></div>
</div>
<div id="tableau"></div>

<script type="module">
const etat = document.getElementById("etat");
const t0 = performance.now();

const w = new Worker("./worker.js", { type: "module" });
const mode = new URLSearchParams(location.search).get("mode") || "pseudo";

w.onerror = (e) => { etat.textContent = "❌ Worker : " + e.message; etat.style.color = "#d63a3f"; };

w.onmessage = ({ data }) => {
  if (data.pret) { pret(); return; }
  if (data.etape) { console.log(data.etape); etat.textContent = data.etape; return; }
  if (!data.ok) { etat.textContent = "❌ " + data.erreur; etat.style.color = "#d63a3f"; return; }
  const { rapport, fuites, avant, apres, echelle, ms, tailleEntree, tailleSortie } = data;
  const total = Math.round(performance.now() - t0);

  const img = (cible, r) => {
    const el = document.getElementById(cible);
    const i = new Image();
    i.src = URL.createObjectURL(new Blob([r.png], { type: "image/png" }));
    el.appendChild(i);
    return i;
  };
  const iAvant = img("avant", avant);
  img("apres", apres);

  // Surlignage des détections, positionné depuis les coordonnées MuPDF
  iAvant.onload = () => {
    const f = iAvant.clientWidth / avant.w;      // image affichée / pixmap
    for (const h of rapport) for (const r of h.rects) {
      const d = document.createElement("div");
      d.className = "zone";
      d.title = `${h.cat} → ${h.token} : ${h.value}`;
      d.style.left   = (r[0] * echelle * f) + "px";
      d.style.top    = (r[1] * echelle * f) + "px";
      d.style.width  = ((r[2] - r[0]) * echelle * f) + "px";
      d.style.height = ((r[3] - r[1]) * echelle * f) + "px";
      iAvant.parentNode.appendChild(d);
    }
  };

  etat.innerHTML =
    `${fuites.length === 0 ? "✅" : "❌"} <b>${rapport.length}</b> détection(s) · ` +
    `fuites : <b>${fuites.length ? fuites.join(", ") : "aucune"}</b> · ` +
    `poids ${tailleEntree} → ${tailleSortie} o (<b>${(tailleSortie / tailleEntree).toFixed(2)}×</b>) · ` +
    `rendu ${ms.rendu} ms, anonymisation ${ms.anon} ms, vérification ${ms.verif} ms · ` +
    `total page <b>${total} ms</b> (WASM compris)`;

  document.getElementById("tableau").innerHTML =
    "<table><thead><tr><th>Catégorie</th><th>Valeur d'origine</th><th>Remplacée par</th></tr></thead><tbody>" +
    rapport.map(h => `<tr><td>${h.cat}</td><td>${h.value.replace(/</g, "&lt;")}</td><td><code>${h.token}</code></td></tr>`).join("") +
    "</tbody></table>";
};

// Attendre le signal « prêt » du worker : sans cela, le message part pendant
// l'évaluation du module (chargement du WASM) et se perd silencieusement.
let pret;
const workerPret = new Promise(r => { pret = r; });

const bytes = await (await fetch("./fiche-reelle.pdf")).arrayBuffer();
etat.textContent = "Chargement du moteur (WASM)…";
await workerPret;
etat.textContent = "Traitement dans le worker…";
w.postMessage({ bytes, mode }, [bytes]);
</script></body></html>
